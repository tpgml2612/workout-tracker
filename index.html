<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💪 운동 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --primary: #FF8B94;
  --primary-light: #FFD4D8;
  --mint: #A8E6CF;
  --text: #3D3D3D;
  --text-light: #9B9B9B;
  --border: #F0E8E0;
  --shadow: rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}
body {
  font-family: 'Jua', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ── USER SELECT ── */
#screen-select { padding: 50px 24px 40px; }
.select-hero { text-align: center; margin-bottom: 36px; }
.select-hero .emoji { font-size: 3.5rem; }
.select-hero h1 { font-size: 2rem; color: var(--primary); margin: 8px 0 4px; }
.select-hero p { color: var(--text-light); font-size: 0.95rem; }
.users-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 24px;
}
.user-card {
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  cursor: pointer; transition: transform 0.2s;
}
.user-card:hover { transform: scale(1.07); }
.profile-circle {
  width: 72px; height: 72px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; color: white;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
  box-shadow: 0 4px 12px var(--shadow);
  font-family: 'Jua', sans-serif;
  flex-shrink: 0;
}
.user-name-label { font-size: 0.82rem; color: var(--text); text-align: center; }
.add-user-card { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.add-circle {
  width: 72px; height: 72px; border-radius: 50%;
  border: 2.5px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--text-light);
  transition: all 0.2s; background: transparent;
  cursor: pointer;
}
.add-circle:hover { border-color: var(--primary); color: var(--primary); }

/* ── TOP BAR ── */
.top-bar {
  background: var(--card);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px var(--shadow);
  position: sticky; top: 0; z-index: 10;
}
.top-bar .profile-circle { width: 38px; height: 38px; font-size: 0.82rem; }
.top-user { display: flex; align-items: center; gap: 10px; }
.top-user-name { font-size: 0.9rem; }
.screen-title { font-size: 1.1rem; }
.nav-btn {
  background: var(--primary-light); color: var(--primary);
  border: none; padding: 7px 13px;
  border-radius: 20px;
  font-family: 'Jua', sans-serif; font-size: 0.82rem;
  cursor: pointer; transition: all 0.2s;
}
.nav-btn:hover { background: var(--primary); color: white; }
.back-btn {
  background: none; border: none;
  font-size: 1.4rem; cursor: pointer; color: var(--text);
  width: 36px;
}

/* ── CALENDAR ── */
.calendar-container { padding: 14px 20px; }
.month-section { margin-bottom: 24px; }
.month-section-title {
  text-align: center; font-size: 1rem;
  color: var(--primary); padding: 10px 0 8px;
  letter-spacing: 0.05em;
}
.cal-header {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
}
.cal-header-day {
  text-align: center; font-size: 0.75rem;
  color: var(--text-light); padding: 3px 0;
}
.cal-header-day:first-child { color: #FF6B6B; }
.cal-header-day:last-child { color: #6B8CFF; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day-cell {
  min-height: 68px; background: var(--card);
  border-radius: 10px; padding: 5px 4px;
  cursor: pointer; transition: all 0.2s;
  border: 2px solid transparent;
  overflow: hidden;
}
.day-cell:hover:not(.disabled):not(.out-range) {
  border-color: var(--primary); box-shadow: 0 2px 8px var(--shadow);
}
.day-cell.disabled { background: transparent; cursor: default; }
.day-cell.out-range { opacity: 0.28; cursor: default; }
.day-cell.today { border-color: var(--mint) !important; }
.day-cell.my-day { background: #FFF0F1; }
.day-num {
  font-size: 0.78rem; font-weight: 700;
  color: var(--text); line-height: 1;
}
.day-cell.disabled .day-num,
.day-cell.out-range .day-num { color: var(--text-light); }
.day-cell .sun .day-num { color: #FF6B6B; }
.day-cell .sat .day-num { color: #6B8CFF; }
.day-profiles { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
.mini-circle {
  width: 19px; height: 19px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.48rem; color: white;
  text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  font-family: 'Jua', sans-serif;
}

/* ── MY RECORDS ── */
.rewards-card {
  margin: 18px 20px;
  background: linear-gradient(135deg, #FF8B94, #FF6B9D);
  border-radius: var(--radius); padding: 22px;
  color: white; text-align: center;
  box-shadow: 0 8px 24px rgba(255,107,157,0.28);
}
.rewards-label { font-size: 0.88rem; opacity: 0.9; }
.rewards-amount { font-size: 2.8rem; margin: 8px 0; }
.rewards-sub { display: flex; justify-content: center; gap: 20px; font-size: 0.8rem; opacity: 0.85; }
.section-title { font-size: 0.88rem; color: var(--text-light); margin: 16px 20px 10px; }
.week-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 13px 16px; margin: 0 20px 10px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 2px 6px var(--shadow);
}
.week-label-text { font-size: 0.88rem; }
.week-sub { font-size: 0.78rem; color: var(--text-light); margin-top: 2px; }
.week-right { text-align: right; }
.week-amount { font-size: 1.05rem; color: var(--primary); }
.week-bonus-tag { font-size: 0.75rem; color: #2ECC71; margin-top: 2px; }
.week-hint { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }
.my-cal-month { font-size: 0.85rem; color: var(--text-light); text-align: center; margin: 14px 0 6px; }
.my-cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; padding: 0 20px; }
.my-cal-day { text-align: center; padding: 5px 2px; font-size: 0.78rem; border-radius: 8px; }
.my-cal-day.worked { background: var(--primary); color: white; border-radius: 50%; font-weight: bold; }
.my-cal-day.in-range { background: var(--card); }
.my-cal-day.out { color: var(--text-light); }
.my-cal-header-day { text-align: center; font-size: 0.7rem; color: var(--text-light); padding: 2px 0; }

/* ── MODALS ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet {
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 20px 22px 32px;
  width: 100%; max-width: 480px; max-height: 88vh;
  overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s ease-out;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 38px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
.modal-title { font-size: 1.15rem; text-align: center; margin-bottom: 16px; }
.input-field {
  width: 100%; padding: 11px 15px;
  border: 2px solid var(--border); border-radius: 12px;
  font-family: 'Jua', sans-serif; font-size: 0.95rem;
  color: var(--text); background: var(--bg);
  outline: none; transition: border-color 0.2s; margin-bottom: 10px;
}
.input-field:focus { border-color: var(--primary); }
.btn {
  width: 100%; padding: 13px; border: none;
  border-radius: 12px;
  font-family: 'Jua', sans-serif; font-size: 0.95rem;
  cursor: pointer; transition: all 0.2s; margin-top: 8px;
}
.btn-p { background: var(--primary); color: white; }
.btn-p:hover { background: #FF6B78; }
.btn-s { background: #F0E8E0; color: var(--text-light); }
.confirm-q { text-align: center; font-size: 1.05rem; line-height: 1.7; margin: 12px 0 22px; white-space: pre-line; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns .btn { flex: 1; margin: 0; }
.ex-row { display: flex; gap: 7px; margin-bottom: 8px; align-items: center; }
.ex-row .input-field { margin-bottom: 0; }
.ex-name { flex: 2; }
.ex-dur { flex: 1; }
.ex-del {
  width: 38px; height: 44px; flex-shrink: 0;
  border: none; background: #FFE0E0; color: #FF6B6B;
  border-radius: 9px; cursor: pointer; font-size: 1.1rem;
}
.add-ex-btn {
  width: 100%; padding: 9px;
  background: #E8F8EF; color: #2D8F5F;
  border: none; border-radius: 10px;
  font-family: 'Jua', sans-serif; font-size: 0.88rem;
  cursor: pointer; margin-bottom: 10px; transition: background 0.2s;
}
.add-ex-btn:hover { background: var(--mint); }
.workout-entry { display: flex; gap: 12px; padding: 11px; background: var(--bg); border-radius: 12px; margin-bottom: 8px; }
.workout-entry .profile-circle { width: 42px; height: 42px; font-size: 0.82rem; }
.we-name { font-size: 0.92rem; margin-bottom: 3px; }
.we-detail { font-size: 0.78rem; color: var(--text-light); line-height: 1.6; }
.empty-state { text-align: center; padding: 36px 20px; color: var(--text-light); font-size: 0.88rem; }
.empty-state-emoji { font-size: 2.8rem; margin-bottom: 10px; }

/* ── COLOR SWATCHES ── */
.color-label { font-size: 0.82rem; color: var(--text-light); margin: 4px 0 8px; }
.color-swatches { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
.color-swatch {
  width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; transition: transform 0.15s;
  border: 3px solid transparent; box-sizing: border-box;
}
.color-swatch:hover { transform: scale(1.18); }
.color-swatch.selected { border-color: #333; transform: scale(1.18); }

/* ── MY WORKOUT LIST ── */
.my-wk-item {
  background: var(--card); border-radius: 12px;
  padding: 12px 14px; margin: 0 20px 8px;
  box-shadow: 0 2px 6px var(--shadow);
}
.my-wk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.my-wk-date { font-size: 0.85rem; color: var(--primary); }
.my-wk-btns { display: flex; gap: 6px; }
.my-wk-btn {
  padding: 4px 10px; border: none; border-radius: 8px;
  font-family: 'Jua', sans-serif; font-size: 0.75rem; cursor: pointer; transition: all 0.15s;
}
.my-wk-edit { background: #E8F0FF; color: #4A6CF7; }
.my-wk-edit:hover { background: #4A6CF7; color: white; }
.my-wk-del { background: #FFE0E0; color: #FF6B6B; }
.my-wk-del:hover { background: #FF6B6B; color: white; }
.my-wk-exs { font-size: 0.8rem; color: var(--text-light); line-height: 1.6; }

/* ── DELETE ACCOUNT ── */
.delete-account-btn {
  display: block; width: calc(100% - 40px); margin: 8px 20px 40px;
  padding: 13px; border: none; border-radius: 12px;
  background: #FFF0F0; color: #FF6B6B;
  font-family: 'Jua', sans-serif; font-size: 0.9rem; cursor: pointer;
  transition: all 0.2s;
}
.delete-account-btn:hover { background: #FF6B6B; color: white; }

::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="app">

<!-- ====== SCREEN 1: USER SELECT ====== -->
<div id="screen-select" class="screen active">
  <div class="select-hero">
    <div class="emoji">💪</div>
    <h1>운동 기록</h1>
    <p>누구로 접속할까요?</p>
  </div>
  <div id="users-grid" class="users-grid">
    <div class="empty-state" style="grid-column:1/-1">
      <div class="empty-state-emoji">⏳</div>불러오는 중...
    </div>
  </div>
</div>

<!-- ====== SCREEN 2: SHARED CALENDAR ====== -->
<div id="screen-main" class="screen">
  <div class="top-bar">
    <div class="top-user">
      <div id="topbar-circle" class="profile-circle"></div>
      <span id="topbar-name" class="top-user-name"></span>
    </div>
    <span class="screen-title">🏃 운동 기록</span>
    <button class="nav-btn" onclick="App.showMyRecords()">내 기록 →</button>
  </div>
  <div class="calendar-container">
    <div id="cal-container"></div>
  </div>
</div>

<!-- ====== SCREEN 3: MY RECORDS ====== -->
<div id="screen-my" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="App.showMain()">←</button>
    <span class="screen-title">📊 내 기록</span>
    <div style="width:36px"></div>
  </div>
  <div class="rewards-card">
    <div class="rewards-label">지금까지 적립한 금액</div>
    <div id="rewards-total" class="rewards-amount">$0</div>
    <div class="rewards-sub">
      <span>운동 보상 <strong id="r-daily">$0</strong></span>
      <span>주간 보너스 <strong id="r-bonus">$0</strong></span>
    </div>
  </div>
  <div class="section-title">주간 현황</div>
  <div id="weekly-breakdown"></div>
  <div class="section-title">내 운동 달력</div>
  <div id="my-calendar"></div>
  <div class="section-title">운동 기록 목록</div>
  <div id="my-workout-list" style="padding-bottom:16px;"></div>
  <button class="delete-account-btn" onclick="App.deleteAccount()">계정 삭제 🗑️</button>
</div>

</div><!-- #app -->

<!-- ====== MODAL: ADD USER ====== -->
<div id="m-adduser" class="modal-overlay" onclick="App.closeIfBg(event,'m-adduser')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 class="modal-title">새 친구 추가 🙌</h2>
    <input id="new-name" type="text" class="input-field" placeholder="이름을 입력하세요" maxlength="6" onkeydown="if(event.key==='Enter')App.addUser()">
    <div class="color-label">나의 색깔 선택</div>
    <div id="color-swatches" class="color-swatches"></div>
    <button class="btn btn-p" onclick="App.addUser()">추가하기</button>
    <button class="btn btn-s" onclick="App.closeModal('m-adduser')">취소</button>
  </div>
</div>

<!-- ====== MODAL: WORKOUT CONFIRM + FORM ====== -->
<div id="m-workout" class="modal-overlay" onclick="App.closeIfBg(event,'m-workout')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div id="wk-confirm">
      <div style="text-align:center;font-size:2.5rem;margin-bottom:6px">🏋️</div>
      <p id="wk-date-txt" class="confirm-q"></p>
      <div class="confirm-btns">
        <button class="btn btn-s" onclick="App.closeModal('m-workout')">아니요</button>
        <button class="btn btn-p" onclick="App.showWorkoutForm()">네, 기록할게요!</button>
      </div>
    </div>
    <div id="wk-form" style="display:none">
      <h2 id="wk-form-title" class="modal-title">오늘의 운동 💪</h2>
      <div id="ex-entries"></div>
      <button class="add-ex-btn" onclick="App.addExRow()">+ 운동 추가</button>
      <textarea id="wk-note" class="input-field" placeholder="메모 (선택사항)" rows="2" style="resize:none;"></textarea>
      <button class="btn btn-p" onclick="App.saveWorkout()">저장하기 💾</button>
      <button class="btn btn-s" onclick="App.closeModal('m-workout')">취소</button>
    </div>
  </div>
</div>

<!-- ====== MODAL: DAY DETAIL ====== -->
<div id="m-detail" class="modal-overlay" onclick="App.closeIfBg(event,'m-detail')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 id="detail-title" class="modal-title"></h2>
    <div id="detail-list"></div>
    <div id="detail-actions"></div>
  </div>
</div>

<script type="module">
// ====================================================
// FIREBASE SETUP
// Firebase Console(https://console.firebase.google.com)에서
// 새 프로젝트 만들기 → Firestore Database 활성화 →
// 프로젝트 설정 → 웹앱 추가 → 아래 값 복붙하세요!
// ====================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIoWFjSfwGSighkEQHAq66TtGu7QWavms",
  authDomain: "workout-friends-f8e8e.firebaseapp.com",
  projectId: "workout-friends-f8e8e",
  storageBucket: "workout-friends-f8e8e.firebasestorage.app",
  messagingSenderId: "1015724243360",
  appId: "1:1015724243360:web:86e48738d0e9057a500cc5"
};

const fireApp = initializeApp(firebaseConfig);
const db = getFirestore(fireApp);

// ====================================================
// CONSTANTS
// ====================================================
const YEAR = 2026;
const VALID_START = new Date(2026, 5, 22); // Jun 22
const VALID_END   = new Date(2026, 7, 14); // Aug 14

const COLORS = [
  '#FF8B94','#FF9D6B','#FFD56B','#6BE0A0',
  '#6BC8E0','#8B94FF','#D46BFF','#FF6BAA',
  '#A0D46B','#6BD4D4','#FF8B6B','#9B6BFF',
];

// ====================================================
// STATE
// ====================================================
let currentUser = null;  // {id, name, color}
let allUsers = {};       // { id: {name,color} }
let workouts = {};       // { "YYYY-MM-DD": [workoutObj,...] }
let selDate = null;
let curMonth = 6;
let selectedColor = null;
let editingWorkoutId = null;

// ====================================================
// HELPERS
// ====================================================
const ds = (y,m,d) =>
  `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

const inRange = (y,m,d) => {
  const x = new Date(y, m-1, d);
  return x >= VALID_START && x <= VALID_END;
};

const isToday = (y,m,d) => {
  const t = new Date();
  return t.getFullYear()===y && t.getMonth()+1===m && t.getDate()===d;
};

const shortName = u => u.name.length > 3 ? u.name.slice(0,3) : u.name;

const fmtDate = s => {
  const [y,m,d] = s.split('-').map(Number);
  return `${y}년 ${m}월 ${d}일`;
};

function colorFor(uid) {
  const keys = Object.keys(allUsers);
  return COLORS[keys.indexOf(uid) % COLORS.length] || COLORS[0];
}

// ====================================================
// FIREBASE OPS
// ====================================================
async function loadUsers() {
  const snap = await getDocs(collection(db,'users'));
  allUsers = {};
  snap.forEach(d => { allUsers[d.id] = d.data(); });
}

async function createUser(name, color) {
  const uid = 'u_' + Date.now();
  await setDoc(doc(db,'users',uid), { name, color, createdAt: serverTimestamp() });
  allUsers[uid] = { name, color };
  return { id: uid, name, color };
}

async function deleteUserFromDB(uid) {
  const q = query(collection(db,'workouts'), where('userId','==',uid));
  const snap = await getDocs(q);
  await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
  await deleteDoc(doc(db,'users',uid));
}

async function deleteWorkoutFromDB(wid) {
  await deleteDoc(doc(db,'workouts',wid));
}

async function updateWorkoutInDB(wid, dateStr, exercises, note) {
  const obj = { userId: currentUser.id, date: dateStr, exercises, note: note||'', updatedAt: serverTimestamp() };
  await setDoc(doc(db,'workouts',wid), obj);
  if (workouts[dateStr]) {
    const idx = workouts[dateStr].findIndex(w => w.id === wid);
    if (idx !== -1) workouts[dateStr][idx] = { id: wid, ...obj };
  }
}

async function loadWorkoutsMonth(m) {
  const lastDay = new Date(YEAR, m, 0).getDate();
  const q = query(
    collection(db,'workouts'),
    where('date','>=', ds(YEAR,m,1)),
    where('date','<=', ds(YEAR,m,lastDay))
  );
  const snap = await getDocs(q);
  snap.forEach(d => {
    const data = d.data();
    if (!workouts[data.date]) workouts[data.date] = [];
    if (!workouts[data.date].find(w => w.id === d.id))
      workouts[data.date].push({ id: d.id, ...data });
  });
}

async function loadAllWorkouts() {
  await Promise.all([loadWorkoutsMonth(6), loadWorkoutsMonth(7), loadWorkoutsMonth(8)]);
}

async function writeWorkout(dateStr, exercises, note) {
  const wid = `${currentUser.id}_${dateStr}_${Date.now()}`;
  const obj = {
    userId: currentUser.id,
    date: dateStr,
    exercises,
    note: note||'',
    createdAt: serverTimestamp()
  };
  await setDoc(doc(db,'workouts',wid), obj);
  if (!workouts[dateStr]) workouts[dateStr] = [];
  workouts[dateStr].push({ id: wid, ...obj });
  return wid;
}

async function getMyWorkouts() {
  const q = query(collection(db,'workouts'), where('userId','==',currentUser.id));
  const snap = await getDocs(q);
  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  return arr;
}

// ====================================================
// REWARDS
// ====================================================
function calcRewards(myWks) {
  const byDate = {};
  myWks.forEach(w => {
    if (!byDate[w.date]) byDate[w.date] = [];
    byDate[w.date].push(w);
  });
  const valid = Object.keys(byDate).filter(d => {
    const [y,m,day] = d.split('-').map(Number);
    return inRange(y,m,day);
  });

  let dailyTotal = 0;
  const dailyMap = {};
  valid.forEach(d => {
    const earned = Math.min(byDate[d].length, 4) * 10;
    dailyMap[d] = earned;
    dailyTotal += earned;
  });

  const weeks = getWeeks();
  let bonusTotal = 0;
  const weekData = weeks.map(w => {
    const daysWorked = w.days.filter(d => valid.includes(d)).length;
    const dailySum = w.days.reduce((s,d) => s + (dailyMap[d]||0), 0);
    const bonus = daysWorked >= 4 ? 20 : 0;
    bonusTotal += bonus;
    return { ...w, daysWorked, dailySum, bonus, total: dailySum + bonus };
  });

  return { total: dailyTotal + bonusTotal, dailyTotal, bonusTotal, weekData, dailyMap };
}

function getWeeks() {
  const weeks = [];
  let cur = new Date(2026, 5, 22);
  const dow = cur.getDay();
  cur.setDate(cur.getDate() - (dow === 0 ? 6 : dow - 1)); // Monday

  const end = new Date(2026, 7, 14);
  while (cur <= end) {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(cur);
      d.setDate(d.getDate() + i);
      if (d >= VALID_START && d <= VALID_END)
        days.push(ds(d.getFullYear(), d.getMonth()+1, d.getDate()));
    }
    if (days.length) {
      const ws = new Date(cur);
      const we = new Date(cur); we.setDate(we.getDate()+6);
      weeks.push({ days, label: `${ws.getMonth()+1}/${ws.getDate()} ~ ${we.getMonth()+1}/${we.getDate()}` });
    }
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

// ====================================================
// CALENDAR RENDER
// ====================================================
const DAY_HEADERS = `
  <div class="cal-header">
    <div class="cal-header-day" style="color:#FF6B6B">일</div>
    <div class="cal-header-day">월</div><div class="cal-header-day">화</div>
    <div class="cal-header-day">수</div><div class="cal-header-day">목</div>
    <div class="cal-header-day">금</div>
    <div class="cal-header-day" style="color:#6B8CFF">토</div>
  </div>`;

function renderAllCal() {
  const container = document.getElementById('cal-container');
  let html = '';

  [6, 7, 8].forEach(month => {
    const last = new Date(YEAR, month, 0).getDate();
    const firstDow = new Date(YEAR, month-1, 1).getDay();
    let cells = '';

    for (let i = 0; i < firstDow; i++)
      cells += '<div class="day-cell disabled"></div>';

    for (let day = 1; day <= last; day++) {
      const d = ds(YEAR, month, day);
      const ir = inRange(YEAR, month, day);
      const wks = workouts[d] || [];
      const myWks = wks.filter(w => w.userId === currentUser?.id);
      const todayCls = isToday(YEAR,month,day) ? ' today' : '';
      const myCls = myWks.length > 0 ? ' my-day' : '';
      const rangeCls = ir ? '' : ' out-range';
      const dow = new Date(YEAR, month-1, day).getDay();
      const numColor = dow===0 ? 'color:#FF6B6B' : dow===6 ? 'color:#6B8CFF' : '';

      const profiles = wks.map(w => {
        const u = allUsers[w.userId];
        if (!u) return '';
        return `<div class="mini-circle" style="background:${u.color}" title="${u.name}">${shortName(u)}</div>`;
      }).join('');

      cells += `<div class="day-cell${rangeCls}${todayCls}${myCls}" onclick="App.dayClick('${d}',${ir})">
        <div class="day-num" style="${numColor}">${day}</div>
        <div class="day-profiles">${profiles}</div>
      </div>`;
    }

    html += `<div class="month-section">
      <div class="month-section-title">${YEAR}년 ${month}월</div>
      ${DAY_HEADERS}
      <div class="cal-grid">${cells}</div>
    </div>`;
  });

  container.innerHTML = html;
}

// ====================================================
// MY CALENDAR RENDER
// ====================================================
function renderMyCal(myDates) {
  const set = new Set(myDates);
  const container = document.getElementById('my-calendar');
  const DAYS = ['일','월','화','수','목','금','토'];
  let html = '';

  [6,7,8].forEach(m => {
    html += `<p class="my-cal-month">${YEAR}년 ${m}월</p>`;
    html += '<div class="my-cal-grid">';
    DAYS.forEach(d => html += `<div class="my-cal-header-day">${d}</div>`);
    const last = new Date(YEAR,m,0).getDate();
    const fdow = new Date(YEAR,m-1,1).getDay();
    for (let i = 0; i < fdow; i++) html += '<div></div>';
    for (let day = 1; day <= last; day++) {
      const d = ds(YEAR,m,day);
      const ir = inRange(YEAR,m,day);
      const cls = set.has(d) ? 'worked' : ir ? 'in-range' : 'out';
      html += `<div class="my-cal-day ${cls}">${day}</div>`;
    }
    html += '</div>';
  });
  container.innerHTML = html;
}

// ====================================================
// APP OBJECT (exposed to window)
// ====================================================
const App = {
  async init() {
    await loadUsers();
    this.renderUserGrid();
  },

  renderUserGrid() {
    const grid = document.getElementById('users-grid');
    let html = Object.entries(allUsers).map(([uid, u]) => `
      <div class="user-card" onclick="App.selectUser('${uid}')">
        <div class="profile-circle" style="background:${u.color}">${shortName(u)}</div>
        <span class="user-name-label">${u.name}</span>
      </div>
    `).join('');
    html += `
      <div class="add-user-card">
        <button class="add-circle" onclick="App.openAddUser()">+</button>
        <span class="user-name-label">새 친구</span>
      </div>`;
    grid.innerHTML = html;
  },

  openAddUser() {
    document.getElementById('new-name').value = '';
    selectedColor = COLORS[0];
    this.renderColorSwatches();
    this.openModal('m-adduser');
    setTimeout(() => document.getElementById('new-name').focus(), 300);
  },

  renderColorSwatches() {
    const container = document.getElementById('color-swatches');
    container.innerHTML = COLORS.map(c =>
      `<div class="color-swatch${c===selectedColor?' selected':''}" style="background:${c}" onclick="App.setColor('${c}')"></div>`
    ).join('');
  },

  setColor(color) {
    selectedColor = color;
    this.renderColorSwatches();
  },

  async addUser() {
    const name = document.getElementById('new-name').value.trim();
    if (!name) return;
    await createUser(name, selectedColor || COLORS[0]);
    this.closeModal('m-adduser');
    this.renderUserGrid();
  },

  async selectUser(uid) {
    currentUser = { id: uid, ...allUsers[uid] };
    document.getElementById('topbar-circle').textContent = shortName(currentUser);
    document.getElementById('topbar-circle').style.background = currentUser.color;
    document.getElementById('topbar-name').textContent = currentUser.name;

    await loadAllWorkouts();
    this.showScreen('screen-main');
    renderAllCal();
  },

  dayClick(dateStr, ir) {
    if (!ir) return;
    selDate = dateStr;
    const wks = workouts[dateStr] || [];
    const myCount = wks.filter(w => w.userId === currentUser.id).length;

    if (wks.length > 0) {
      this.openDayDetail(dateStr, wks, myCount < 4);
    } else {
      this.openConfirm(dateStr);
    }
  },

  openConfirm(dateStr) {
    selDate = dateStr;
    document.getElementById('wk-date-txt').textContent =
      `${fmtDate(dateStr)}\n운동을 기록하시겠습니까? 🏃`;
    document.getElementById('wk-confirm').style.display = 'block';
    document.getElementById('wk-form').style.display = 'none';
    this.openModal('m-workout');
  },

  showWorkoutForm() {
    editingWorkoutId = null;
    document.getElementById('wk-confirm').style.display = 'none';
    document.getElementById('wk-form').style.display = 'block';
    document.getElementById('wk-form-title').textContent = '오늘의 운동 💪';
    document.getElementById('ex-entries').innerHTML = '';
    document.getElementById('wk-note').value = '';
    this.addExRow();
  },

  addExRow() {
    const div = document.createElement('div');
    div.className = 'ex-row';
    div.innerHTML = `
      <input type="text" class="input-field ex-name" placeholder="운동 종류 (런닝, 수영...)">
      <input type="number" class="input-field ex-dur" placeholder="분" min="1" max="600">
      <button class="ex-del" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('ex-entries').appendChild(div);
  },

  async saveWorkout() {
    const rows = document.querySelectorAll('#ex-entries .ex-row');
    const exercises = [];
    rows.forEach(r => {
      const name = r.querySelector('.ex-name').value.trim();
      const dur = parseInt(r.querySelector('.ex-dur').value) || 0;
      if (name) exercises.push({ name, duration: dur });
    });
    if (!exercises.length) { alert('운동을 하나 이상 입력해주세요!'); return; }
    const note = document.getElementById('wk-note').value.trim();
    const isEdit = !!editingWorkoutId;
    try {
      if (isEdit) {
        await updateWorkoutInDB(editingWorkoutId, selDate, exercises, note);
        editingWorkoutId = null;
      } else {
        await writeWorkout(selDate, exercises, note);
      }
      this.closeModal('m-workout');
      renderAllCal();
      if (document.getElementById('screen-my').classList.contains('active')) this.showMyRecords();
      this.toast(isEdit ? '수정됐어요 ✏️' : '운동 기록 완료! 💪');
    } catch(e) {
      console.error(e);
      alert('저장 실패. Firebase 설정을 확인해주세요.\n' + e.message);
    }
  },

  openDayDetail(dateStr, wks, canAdd) {
    document.getElementById('detail-title').textContent = fmtDate(dateStr) + ' 운동 현황';
    const list = wks.map(w => {
      const u = allUsers[w.userId];
      if (!u) return '';
      const exs = (w.exercises||[]).map(e => `${e.name}${e.duration ? ` ${e.duration}분`:''}` ).join(', ');
      return `<div class="workout-entry">
        <div class="profile-circle" style="background:${u.color};width:42px;height:42px;font-size:0.82rem">${shortName(u)}</div>
        <div>
          <div class="we-name">${u.name}</div>
          <div class="we-detail">${exs||'기록 없음'}${w.note ? '<br>📝 '+w.note : ''}</div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('detail-list').innerHTML = list ||
      '<div class="empty-state">기록 없음</div>';
    document.getElementById('detail-actions').innerHTML = canAdd
      ? `<button class="btn btn-p" style="margin-top:14px"
           onclick="App.closeModal('m-detail');App.openConfirm('${dateStr}')">
           나도 기록하기 💪
         </button>`
      : '';
    this.openModal('m-detail');
  },

  async showMyRecords() {
    this.showScreen('screen-my');
    const my = await getMyWorkouts();
    const r = calcRewards(my);
    document.getElementById('rewards-total').textContent = `$${r.total}`;
    document.getElementById('r-daily').textContent = `$${r.dailyTotal}`;
    document.getElementById('r-bonus').textContent = `$${r.bonusTotal}`;

    const wb = document.getElementById('weekly-breakdown');
    wb.innerHTML = r.weekData.map(w => {
      const hint = w.daysWorked < 4
        ? `<div class="week-hint">${4-w.daysWorked}일 더 하면 보너스!</div>` : '';
      const bonus = w.bonus > 0
        ? `<div class="week-bonus-tag">+$20 주간 보너스 🎉</div>` : hint;
      return `<div class="week-card">
        <div>
          <div class="week-label-text">${w.label}</div>
          <div class="week-sub">운동 ${w.daysWorked}일 · $${w.dailySum}</div>
        </div>
        <div class="week-right">
          <div class="week-amount">$${w.total}</div>
          ${bonus}
        </div>
      </div>`;
    }).join('') || '<div class="empty-state"><div class="empty-state-emoji">📅</div>아직 기록이 없어요</div>';

    renderMyCal(my.map(w => w.date));

    // Workout list (sorted newest first)
    const wkList = document.getElementById('my-workout-list');
    const sorted = [...my].sort((a,b) => b.date.localeCompare(a.date));
    wkList.innerHTML = sorted.length ? sorted.map(w => {
      const exs = (w.exercises||[]).map(e => `${e.name}${e.duration ? ` ${e.duration}분`:''}`).join(' · ');
      return `<div class="my-wk-item">
        <div class="my-wk-header">
          <div class="my-wk-date">${fmtDate(w.date)}</div>
          <div class="my-wk-btns">
            <button class="my-wk-btn my-wk-edit" onclick="App.editWorkout('${w.id}','${w.date}')">수정 ✏️</button>
            <button class="my-wk-btn my-wk-del" onclick="App.deleteWorkout('${w.id}','${w.date}')">삭제 🗑️</button>
          </div>
        </div>
        <div class="my-wk-exs">${exs||'기록 없음'}${w.note ? ' · 📝 '+w.note : ''}</div>
      </div>`;
    }).join('') : '<div class="empty-state"><div class="empty-state-emoji">🏃</div>운동 기록이 없어요</div>';
  },

  editWorkout(wid, dateStr) {
    const wk = (workouts[dateStr]||[]).find(w => w.id === wid);
    if (!wk) return;
    selDate = dateStr;
    editingWorkoutId = wid;
    document.getElementById('wk-confirm').style.display = 'none';
    document.getElementById('wk-form').style.display = 'block';
    document.getElementById('wk-form-title').textContent = `${fmtDate(dateStr)} 수정 ✏️`;
    const container = document.getElementById('ex-entries');
    container.innerHTML = '';
    (wk.exercises||[{ name:'', duration:'' }]).forEach(e => {
      const div = document.createElement('div');
      div.className = 'ex-row';
      div.innerHTML = `
        <input type="text" class="input-field ex-name" value="${e.name||''}" placeholder="운동 종류">
        <input type="number" class="input-field ex-dur" value="${e.duration||''}" placeholder="분" min="1" max="600">
        <button class="ex-del" onclick="this.parentElement.remove()">×</button>`;
      container.appendChild(div);
    });
    document.getElementById('wk-note').value = wk.note || '';
    this.openModal('m-workout');
  },

  async deleteWorkout(wid, dateStr) {
    if (!confirm('이 운동 기록을 삭제할까요?')) return;
    try {
      await deleteWorkoutFromDB(wid);
      if (workouts[dateStr]) workouts[dateStr] = workouts[dateStr].filter(w => w.id !== wid);
      renderAllCal();
      this.showMyRecords();
      this.toast('삭제됐어요');
    } catch(e) { alert('삭제 실패: ' + e.message); }
  },

  async deleteAccount() {
    if (!confirm(`"${currentUser.name}" 계정을 삭제할까요?\n운동 기록도 모두 삭제돼요.`)) return;
    try {
      await deleteUserFromDB(currentUser.id);
      delete allUsers[currentUser.id];
      Object.keys(workouts).forEach(d => {
        workouts[d] = workouts[d].filter(w => w.userId !== currentUser.id);
      });
      currentUser = null;
      this.showScreen('screen-select');
      await this.init();
      this.toast('계정이 삭제됐어요');
    } catch(e) { alert('삭제 실패: ' + e.message); }
  },

  showMain() {
    this.showScreen('screen-main');
    renderAllCal();
  },

  showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  },

  openModal(id) { document.getElementById(id).classList.add('open'); },
  closeModal(id) { document.getElementById(id).classList.remove('open'); },
  closeIfBg(e, id) { if (e.target === e.currentTarget) this.closeModal(id); },

  toast(msg) {
    const t = document.createElement('div');
    Object.assign(t.style, {
      position:'fixed', bottom:'80px', left:'50%',
      transform:'translateX(-50%)',
      background:'#333', color:'#fff',
      padding:'11px 22px', borderRadius:'22px',
      fontFamily:"'Jua',sans-serif", fontSize:'0.9rem',
      zIndex:'9999', transition:'opacity 0.4s',
      whiteSpace:'nowrap'
    });
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 400); }, 2200);
  }
};

window.App = App;
App.init();
</script>
